<body>
  <div id="game-container"></div>

  <!-- Touch controls overlay (mobile) -->
  <div id="touch-controls">
    <div class="dpad">
      <div class="dpad-row">
        <div class="dpad-spacer"></div>
        <button id="btn-up" class="dpad-btn up">▲</button>
        <div class="dpad-spacer"></div>
      </div>
      <div class="dpad-row">
        <button id="btn-left" class="dpad-btn left">◀</button>
        <div class="dpad-center"></div>
        <button id="btn-right" class="dpad-btn right">▶</button>
      </div>
      <div class="dpad-row">
        <div class="dpad-spacer"></div>
        <button id="btn-down" class="dpad-btn down">▼</button>
        <div class="dpad-spacer"></div>
      </div>
    </div>
    <div class="action-buttons">
      <button id="btn-interact" class="action-btn interact">E</button>
      <button id="btn-attack" class="action-btn attack">A</button>
    </div>
  </div>

  <!-- Diagnostic panel outside Phaser canvas -->
  <div id="diag-panel">
    <div style="font-weight: bold; color: #ffffff; margin-bottom: 8px;">GRAVEYARD GAUNTLET — DIAGNOSTICS</div>
    <div id="diag-stage-init" class="stage info">INIT: HTML loaded</div>
    <div id="diag-stage-phaser" class="stage info">PHASER: waiting...</div>
    <div id="diag-stage-boot" class="stage info">BOOT: waiting...</div>
    <div id="diag-stage-main" class="stage info">MAIN: waiting...</div>
    <div id="diag-stage-ui" class="stage info">UI: waiting...</div>
    <div id="diag-errors" class="stage fail" style="display:none;"></div>
  </div>

  <div id="loading-overlay" class="loading-overlay">
  <div style="font-size: 24px; font-weight: bold; letter-spacing: 2px;">GRAVEYARD GAUNTLET</div>
  <div style="font-size: 14px; margin-top: 8px; opacity: 0.8;">Loading...</div>
  <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
  </div>

  <script>
    // Global loading overlay control — accessible from Phaser game code
    window.__hideLoading = function () {
      const el = document.getElementById('loading-overlay')
      if (el) {
        el.style.transition = 'opacity 0.3s ease'
        el.style.opacity = '0'
        setTimeout(() => { el.style.display = 'none' }, 300)
      }
    }

    window.__showError = function (msg) {
      const el = document.getElementById('loading-overlay')
      if (el) {
        el.innerHTML = '<div style="color:#ff4444;font-weight:bold;">LOAD ERROR</div>' +
                   '<div style="color:#e0e0e0;margin-top:8px;">' + msg + '</div>'
        el.style.background = '#1a0000'
      }
      console.error('GAME LOAD ERROR:', msg)
    }

    // Fallback: hide loading overlay after 10 seconds even if something goes wrong
    setTimeout(function () {
      const el = document.getElementById('loading-overlay')
      if (el && el.style.display !== 'none') {
        window.__hideLoading()
      }
    }, 10000)
  </script>

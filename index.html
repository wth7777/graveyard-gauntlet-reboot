<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Graveyard Gauntlet — Side-Scrolling Beat-'Em-Up Reboot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
    #game-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; z-index: 10; }
    canvas { display: block; }
    .loading-overlay {
      position: fixed; inset: 0; background: #0a0a0a; color: #e0e0e0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; font-family: 'Courier New, monospace';
    }
    .loading-bar { width: 300px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 16px; }
    .loading-fill { width: 0%; height: 100%; background: #4ade80; transition: width 0.1s; }
    #diag-panel {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.9);
      color: #00ff00;
      font-family: 'Courier New, monospace';
      font-size: 14px;
      padding: 10px;
      border: 2px solid #00ff00;
      border-radius: 4px;
      max-width: 400px;
      display: none;
    }
    #diag-panel .stage { margin: 4px 0; }
    #diag-panel .stage.ok { color: #00ff00; }
    #diag-panel .stage.fail { color: #ff0000; }
    #diag-panel .stage.info { color: #ffff00; }
    #touch-controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 10px;
      pointer-events: auto;
      z-index: 100;
    }
    .dpad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .dpad-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dpad-spacer {
      width: 44px;
      height: 44px;
    }
    .dpad-center {
      width: 44px;
      height: 44px;
    }
    .dpad-btn {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 10px;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .dpad-btn:active {
      background: rgba(255, 255, 255, 0.35);
    }
    .action-buttons {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    .action-btn {
      width: 56px;
      height: 56px;
      border-radius: 28px;
      border: 2px solid rgba(255, 255, 255, 0.5);
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .action-btn.attack {
      background: rgba(255, 80, 80, 0.25);
      border-color: rgba(255, 120, 120, 0.6);
    }
    .action-btn.jump {
      background: rgba(80, 120, 255, 0.25);
      border-color: rgba(120, 180, 255, 0.6);
    }
    .action-btn.special {
      background: rgba(200, 80, 255, 0.25);
      border-color: rgba(240, 120, 255, 0.6);
    }
    .action-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
  <script type="module" crossorigin src="/graveyard-gauntlet-reboot/assets/game-BlemWzsY.js"></script>
</head>
<body>
  <div id="game-container"></div>

  <!-- Touch controls overlay (mobile) -->
  <div id="touch-controls">
    <div class="dpad">
      <div class="dpad-row">
        <div class="dpad-spacer"></div>
        <button id="btn-up" class="dpad-btn up">▲</button>
        <div class="dpad-spacer"></div>
      </div>
      <div class="dpad-row">
        <button id="btn-left" class="dpad-btn left">◀</button>
        <div class="dpad-center"></div>
        <button id="btn-right" class="dpad-btn right">▶</button>
      </div>
      <div class="dpad-row">
        <div class="dpad-spacer"></div>
        <button id="btn-down" class="dpad-btn down">▼</button>
        <div class="dpad-spacer"></div>
      </div>
    </div>
    <div class="action-buttons">
      <button id="btn-jump" class="action-btn jump">JUMP</button>
      <button id="btn-attack" class="action-btn attack">ATTACK</button>
      <button id="btn-special" class="action-btn special">SPECIAL</button>
    </div>
  </div>

  <!-- Diagnostic panel outside Phaser canvas -->
  <div id="diag-panel">
    <div style="font-weight: bold; color: #ffffff; margin-bottom: 8px;">GRAVEYARD GAUNTLET — REBOOT DIAGNOSTICS</div>
    <div id="diag-stage-init" class="stage info">INIT: HTML loaded</div>
    <div id="diag-stage-phaser" class="stage info">PHASER: waiting...</div>
    <div id="diag-stage-boot" class="stage info">BOOT: waiting...</div>
    <div id="diag-stage-level" class="stage info">LEVEL: waiting...</div>
    <div id="diag-errors" class="stage fail" style="display:none;"></div>
  </div>

  <div id="loading-overlay" class="loading-overlay">
    <div style="font-size: 24px; font-weight: bold; letter-spacing: 2px;">GRAVEYARD GAUNTLET</div>
    <div style="font-size: 14px; margin-top: 8px; opacity: 0.8;">Loading assets...</div>
    <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
  </div>
  <script>
    // Global diagnostic functions that Phaser can call
    window.__diag = {
      setStage: function(id, status, text) {
        const el = document.getElementById(id);
        if (el) {
          el.textContent = text || id;
          el.className = 'stage ' + (status === 'ok' ? 'ok' : status === 'fail' ? 'fail' : 'info');
          el.style.display = 'block';
        }
      },
      addError: function(msg) {
        const el = document.getElementById('diag-errors');
        if (el) {
          el.style.display = 'block';
          el.textContent += 'ERROR: ' + msg + '\\n';
        }
        console.error('DIAG ERROR:', msg);
      },
      updateCanvasInfo: function() {
        const el = document.getElementById('canvas-info');
        const canvas = document.querySelector('canvas');
        if (el && canvas) {
          const rect = canvas.getBoundingClientRect();
          const style = getComputedStyle(canvas);
          el.innerHTML = [
            'Canvas: ' + canvas.width + 'x' + canvas.height,
            'CSS: ' + rect.width.toFixed(0) + 'x' + rect.height.toFixed(0),
            'Style w/h: ' + style.width + ' / ' + style.height,
            'Opacity: ' + style.opacity,
            'Visibility: ' + style.visibility,
            'Display: ' + style.display,
            'Z-index: ' + style.zIndex,
            'Position: ' + style.position,
            'Game running: ' + (window.game ? window.game.isRunning : 'no game'),
            'Game booted: ' + (window.game ? window.game.isBooted : 'no game'),
            'Game destroyed: ' + (window.game ? window.game.isDestroyed : 'no game')
          ].join('<br>');
        }
      }
    };

    // Periodically update canvas info
    setInterval(() => {
      if (window.__diag) window.__diag.updateCanvasInfo();
    }, 500);

    // Hide loading overlay when Phaser is ready
    const hideLoading = () => {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) overlay.style.display = 'none';
    };
    const checkReady = setInterval(() => {
      if (window.game && window.game.isBooted) {
        hideLoading();
        clearInterval(checkReady);
      }
    }, 100);
    setTimeout(() => { hideLoading(); clearInterval(checkReady); }, 5000);
  </script>
  <script>
    window.addEventListener('error', function(e) {
      const el = document.getElementById('diag-errors');
      if (el) {
        el.style.display = 'block';
        el.textContent += 'GLOBAL ERROR: ' + (e.message || 'unknown') + ' at ' + (e.filename || 'unknown') + ':' + (e.lineno || 'unknown') + '\\n';
      }
      console.error('GLOBAL ERROR:', e);
    });
    window.addEventListener('unhandledrejection', function(e) {
      const el = document.getElementById('diag-errors');
      if (el) {
        el.style.display = 'block';
        el.textContent += 'UNHANDLED REJECTION: ' + (e.reason || 'unknown') + '\\n';
      }
      console.error('UNHANDLED REJECTION:', e);
    });
  </script>
</body>
</html>
